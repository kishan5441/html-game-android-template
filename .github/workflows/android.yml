name: Build Android AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --include=dev

      - name: FORCE Clean and Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate app icons and splash
        run: npx @capacitor/assets generate --android

      - name: Patch AndroidManifest
        run: node scripts/patch-android.mjs

      - name: Decode Keystore (With Strict Check)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ Error: ANDROID_KEYSTORE_BASE64 is empty!"
            exit 1
          fi
          
          # File decode karo
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          
          # Check karo ki file bani ya nahi aur size kya hai
          FILE_SIZE=$(stat -c%s android/app/release.keystore)
          echo "✅ Decoded Keystore Size: $FILE_SIZE bytes"
          
          # Agar file 1000 bytes se chhoti hai, toh matlab text aadha kat gaya hai
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "❌ ERROR: Keystore file is too small ($FILE_SIZE bytes)."
            echo "Aapka Base64 text copy-paste karte waqt cut off ho gaya hai. Kripya Termux se poora Base64 dobara copy karein."
            exit 1
          fi

      - name: Verify Keystore Alias and Password
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore android/app/release.keystore -storepass "$KS_PASSWORD" -alias "$KEY_ALIAS" || { echo "❌ Keystore verification failed! Alias or password is incorrect."; exit 1; }

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Patch build.gradle
        run: node scripts/patch-gradle.mjs

      - name: Set versionCode and versionName
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.0"
          fi
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build signed AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
