name: Build Android AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --include=dev

      - name: FORCE Clean and Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate app icons and splash
        run: npx @capacitor/assets generate --android

      - name: Patch AndroidManifest
        run: node scripts/patch-android.mjs

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ Error: ANDROID_KEYSTORE_BASE64 is empty!"
            exit 1
          fi
          # tr -d lagana zaroori hai taaki extra enters/spaces na aayein
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release.keystore
          echo "✅ Decoded Keystore Size: $(stat -c%s android/app/release.keystore) bytes"

      - name: Debug Verify Keystore
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Password Length (characters): ${#KS_PASSWORD}"
          echo "Alias Length (characters): ${#KEY_ALIAS}"
          echo "Alias Provided: '$KEY_ALIAS'"
          
          echo "--- Testing Store Password Only ---"
          # Ye command sirf password check karegi (alias ko ignore karegi)
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASSWORD"; then
            echo "❌ Password is WRONG. Please check ANDROID_KEYSTORE_PASSWORD secret (Check for hidden spaces)."
            exit 1
          fi
          
          echo "--- Testing Store Password + Alias ---"
          # Ye command alias check karegi
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASSWORD" -alias "$KEY_ALIAS"; then
            echo "❌ Alias is WRONG. Please check ANDROID_KEY_ALIAS secret (e.g., release, upload)."
            exit 1
          fi
          
          echo "✅ Keystore perfectly verified!"

      - name: Create key.properties
        run: |
          # Key properties file create karte waqt koi extra space na aaye, isliye quotes use kiye hain
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties

      - name: Patch build.gradle
        run: node scripts/patch-gradle.mjs

      - name: Set versionCode and versionName
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.0"
          fi
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build signed AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
