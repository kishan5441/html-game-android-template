name: Build Android AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node 20 deprecation warning fix

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          # --include=dev zaroori hai taaki Capacitor CLI install ho sake
          npm install --include=dev

      - name: Ensure www directory exists
        run: mkdir -p www

      - name: Check Capacitor environment
        run: npx cap doctor # Agar koi dependency missing hai toh yahan error dega

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      # ... (baaki steps: Generate icons, patch manifest, decode keystore, build, upload AAB)
